name: Publish reviewed portfolio to GitHub Pages

# Publishing is manual. Saving or pushing the files alone will not run this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Regenerate and check static pages
        run: |
          python tools/build.py --base-path "${{ steps.pages.outputs.base_path }}"
          python tools/validate.py
      - name: Stage only public website assets
        run: |
          mkdir -p _public
          cp index.html 404.html .nojekyll _public/
          cp -R assets projects _public/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _public
      - name: Deploy reviewed files
        id: deployment
        uses: actions/deploy-pages@v4
