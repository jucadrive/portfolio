<text x="330" y="168" fill="#556173" font-size="17">가용 수량 검사</text></g><path d="M 561 136 H 586" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="590" y="78" width="250" height="116" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/>
