<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400" role="img" aria-labelledby="title desc">
<title id="title">뽀싹 — 직접 조립한 센서 회로 구성 개념도</title><desc id="desc">물의 TDS 센서 신호와 수온을 측정합니다. SEN0244의 아날로그 전압은 ADS1115를 거쳐 I2C로, DS18B20의 수온은 1-Wire로 ESP32에 전달됩니다. 실측 수온으로 TDS 전압을 보정한 뒤 ppm으로 환산해 MQTT로 전송합니다. 센서 키트를 직접 구입해 빵판과 점퍼 케이블로 연결했습니다. 실제 핀 배선도는 아닙니다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#347768"/></marker><pattern id="holes" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.1" fill="#347768" fill-opacity=".13"/></pattern></defs>
<rect width="1150" height="400" rx="18" fill="#edf5f1"/><rect x="272" y="67" width="570" height="292" rx="14" fill="url(#holes)" stroke="#347768" stroke-opacity=".15"/>
<g font-family="'Malgun Gothic', sans-serif"><text x="30" y="38" fill="#347768" font-size="16">센서 키트 직접 구입 · 빵판과 점퍼 케이블로 회로 조립</text><path d="M245 132H296" fill="none" stroke="#347768" stroke-width="2.5" marker-end="url(#arrow)"/><text x="248" y="113" fill="#347768" font-size="15">전압</text><path d="M515 132H555V195H586" fill="none" stroke="#347768" stroke-width="2.5" marker-end="url(#arrow)"/><text x="531" y="112" fill="#347768" font-size="15">I²C</text><path d="M245 296H500V243H586" fill="none" stroke="#347768" stroke-width="2.5" marker-end="url(#arrow)"/><text x="332" y="280" fill="#347768" font-size="15">1-Wire</text><path d="M815 215H886" fill="none" stroke="#347768" stroke-width="2.5" marker-end="url(#arrow)"/><g><rect x="30" y="75" width="215" height="112" rx="12" fill="white" stroke="#347768" stroke-opacity=".35"/>
<text x="47" y="106" fill="#347768" font-size="14">SEN0244</text><text x="47" y="140" fill="#23273f" font-size="23" font-weight="700">TDS 센서</text><text x="47" y="169" fill="#556173" font-size="16">수중 TDS 측정 신호</text></g><g><rect x="300" y="75" width="215" height="112" rx="12" fill="white" stroke="#347768" stroke-opacity=".35"/>
<text x="317" y="106" fill="#347768" font-size="14">ADC</text><text x="317" y="140" fill="#23273f" font-size="23" font-weight="700">ADS1115</text><text x="317" y="169" fill="#556173" font-size="16">전압 디지털 변환</text></g><g><rect x="30" y="240" width="215" height="112" rx="12" fill="white" stroke="#347768" stroke-opacity=".35"/>
<text x="47" y="271" fill="#347768" font-size="14">TEMPERATURE</text><text x="47" y="305" fill="#23273f" font-size="23" font-weight="700">DS18B20</text><text x="47" y="334" fill="#556173" font-size="16">실측 수온</text></g><g><rect x="590" y="150" width="225" height="130" rx="12" fill="white" stroke="#347768" stroke-opacity=".35"/>
<text x="607" y="181" fill="#347768" font-size="14">C · ESP-IDF</text><text x="607" y="215" fill="#23273f" font-size="23" font-weight="700">ESP32</text><text x="607" y="244" fill="#556173" font-size="16">전압 보정 · ppm 환산</text></g><g><rect x="890" y="160" width="230" height="112" rx="12" fill="white" stroke="#347768" stroke-opacity=".35"/>
<text x="907" y="191" fill="#347768" font-size="14">MQTT</text><text x="907" y="225" fill="#23273f" font-size="23" font-weight="700">보정 TDS · 수온</text><text x="907" y="254" fill="#556173" font-size="16">서버로 측정값 전송</text></g><text x="590" y="336" fill="#347768" font-size="16">실측 수온으로 TDS 전압을 25°C 기준 보정</text><text x="30" y="382" fill="#556173" font-size="13">구성 개념도 · 전원과 GPIO는 실제 장비 설정에서 별도로 관리합니다.</text></g></svg>