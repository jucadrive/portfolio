<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 380" width="1150" height="380" role="img" aria-labelledby="title desc">
<title id="title">Redis 품절 처리 처리 흐름</title><desc id="desc">Lua 수량 검사: 품절이면 즉시 종료 → Redis 선예약: 가용 수량 원자 차감 → DB 트랜잭션: Atomic · 주문 저장 → 할당 응답: 성공 결과 반환; 별도 경로: DB 처리 실패: 예약 트랜잭션 롤백 → Redis 보상: 차감한 수량 반환</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#946b35"/></marker></defs>
