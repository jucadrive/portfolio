<text x="890" y="168" fill="#556173" font-size="17">성공 결과 반환</text></g><text x="30" y="248" font-size="14" fill="#946b35">별도 처리 경로</text><rect x="30" y="263" width="530" height="76" rx="10" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="50" y="294" fill="#23273f" font-size="20" font-weight="700">DB 처리 실패</text><text x="50" y="321" fill="#556173" font-size="17">예약 트랜잭션 롤백</text><rect x="590" y="263" width="530" height="76" rx="10" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="610" y="294" fill="#23273f" font-size="20" font-weight="700">Redis 보상</text><text x="610" y="321" fill="#556173" font-size="17">차감한 수량 반환</text><path d="M 562 301 H 586" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/></g></svg>