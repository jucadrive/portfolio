<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400" role="img" aria-labelledby="title desc"><title id="title">WMS-Lite 단계별 개선 과정</title><desc id="desc">V0 기본 API·오류 재현 → V1 동시성 전략 비교 → V2 DB 접근 최적화 → V3 Redis 품절 처리 → V4 Kafka·Outbox → V5 멱등성·장애 복구</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#946b35"/></marker></defs><rect width="1150" height="400" rx="18" fill="#f9f2e9"/><g font-family="'Malgun Gothic', sans-serif"><text x="30" y="37" fill="#946b35" font-size="14" letter-spacing="2">WMS-LITE / V0 → V5</text><rect x="30" y="68" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="50" y="96" fill="#946b35" font-size="14">V0</text><text x="50" y="134" fill="#23273f" font-size="23" font-weight="700">기본 API</text><text x="50" y="167" fill="#556173" font-size="17">초과 할당 재현</text><path d="M 362 130 H 402" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="68" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="430" y="96" fill="#946b35" font-size="14">V1</text><text x="430" y="134" fill="#23273f" font-size="23" font-weight="700">동시성 비교</text><text x="430" y="167" fill="#556173" font-size="17">조건부 UPDATE 선택</text><path d="M 742 130 H 782" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="68" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="810" y="96" fill="#946b35" font-size="14">V2</text><text x="810" y="134" fill="#23273f" font-size="23" font-weight="700">DB 최적화</text><text x="810" y="167" fill="#556173" font-size="17">불필요한 SQL 축소</text><rect x="30" y="238" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="50" y="266" fill="#946b35" font-size="14">V3</text><text x="50" y="304" fill="#23273f" font-size="23" font-weight="700">Redis 품절 처리</text><text x="50" y="337" fill="#556173" font-size="17">DB 접근 전 품절 응답</text><path d="M 362 300 H 402" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="238" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="430" y="266" fill="#946b35" font-size="14">V4</text><text x="430" y="304" fill="#23273f" font-size="23" font-weight="700">이벤트 발행</text><text x="430" y="337" fill="#556173" font-size="17">Kafka · Outbox</text><path d="M 742 300 H 782" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="238" width="330" height="124" rx="12" fill="white" stroke="#946b35" stroke-opacity=".28"/><text x="810" y="266" fill="#946b35" font-size="14">V5</text><text x="810" y="304" fill="#23273f" font-size="23" font-weight="700">멱등성·복구</text><text x="810" y="337" fill="#556173" font-size="17">중복 방지 · 재처리</text><path d="M1122 130 H1134 V218 H195 V232" fill="none" stroke="#946b35" stroke-width="2" marker-end="url(#arrow)"/></g></svg>